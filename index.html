<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой мессенджер</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10121b;
      color: #ffffff;
    }

    header {
      padding: 22px;
      background: #191c2a;
      border-bottom: 1px solid #303449;
    }

    h1 {
      margin: 0;
      color: #a78bfa;
      font-size: 25px;
    }

    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: #1b1f30;
      border: 1px solid #303449;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
    }

    h2 {
      margin-top: 0;
    }

    p {
      color: #c1c5d5;
      line-height: 1.5;
    }

    button {
      background: #7c5cfc;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #6945ed;
    }

    footer {
      text-align: center;
      color: #858ba3;
      padding: 25px;
    }
  </style>
</head>
<body>
  <header>
    <h1>✦ Мессенджер</h1>
  </header>

  <main>
    <section class="card">
      <h2>Добро пожаловать!</h2>
      <p>Наш мессенджер только начинается.</p>
      <p>Здесь появятся личные сообщения, группы и список друзей.</p>
      <button onclick="alert('Скоро здесь появятся чаты!')">
        Начать общение
      </button>
    </section>

    <section class="card">
      <h2>Что нас ждёт?</h2>
      <p>✓ Личные и групповые чаты</p>
      <p>✓ Поиск пользователей по имени и ID</p>
      <p>✓ История сообщений</p>
      <p>✓ Статусы онлайн и офлайн</p>
    </section>
  </main>

  <footer>Первая версия · 2026</footer>
</body>
</html>
